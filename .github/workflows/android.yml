name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            -PrelayToken="$RELAY_TOKEN"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hookbox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 发 Release 时触发的构建：把 APK 改名带上 tag，挂到对应 Release 下供直接下载
      - name: Name APK for release
        if: github.event_name == 'release'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "hookbox-${{ github.event.release.tag_name }}.apk"

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: hookbox-${{ github.event.release.tag_name }}.apk
          fail_on_unmatched_files: true
