# HookBox —— webhook 中转服务
# 只占用 /hookbox/ 这个路径前缀，根路径留空，以后 your-domain.com 想放正式站点不受影响。
# 由 HookBox 部署脚本生成，删除本文件 + 移除 sites-enabled 软链即可完全回滚。

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/ssl/your-domain.com_nginx/your-domain.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com_nginx/your-domain.com.key;

    client_max_body_size 2m;

    location = /hookbox {
        return 301 /hookbox/;
    }

    location /hookbox/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接必需
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 根路径暂时不提供服务，给以后留位置
    location / {
        return 404;
    }
}
